name: ci
on: [push, pull_request]

jobs:
  py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: make lint types
      - run: make test
      - run: make perf
      - name: schemas are up to date
        run: make schema && git diff --exit-code schemas/

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: make web-install
      - name: Типы API совпадают со schemas/openapi.json
        run: npm --prefix ui/web run gen:types && git diff --exit-code ui/web/src/api/schema.ts
      - run: make web-lint
      - run: make web-test
      - run: make web-build
