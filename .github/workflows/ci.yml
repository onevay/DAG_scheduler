name: ci
on: [push, pull_request]

jobs:
  py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --all-extras
      - run: make lint types
      - run: make test
      - run: make perf
      - name: schemas are up to date
        run: make schema && git diff --exit-code schemas/
      - name: Уязвимости Python-зависимостей
        run: make audit-py

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: make web-install
      - name: Типы API совпадают со schemas/openapi.json
        run: npm --prefix ui/web run gen:types && git diff --exit-code ui/web/src/api/schema.ts
      - run: make web-lint
      - run: make web-test
      - run: make web-build
      - name: Уязвимости JS-зависимостей
        run: make audit-web

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --extra api  # API для сквозных проверок: fastapi и uvicorn
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: make web-install
      - name: Chromium для Playwright
        run: npm --prefix ui/web exec -- playwright install --with-deps chromium
      - run: make web-e2e
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/web/playwright-report
            ui/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t expsched:ci .
      - name: Контейнер поднимается, отдаёт клиент и API
        run: |
          docker run -d --name expsched -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp --cap-drop ALL expsched:ci
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' expsched)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' expsched | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/builder | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/v1/scenarios | grep -q '"name"'
          curl -fsS -X POST http://127.0.0.1:8000/v1/runs -H 'Content-Type: application/json' \
            --data "{\"problem\": $(curl -fsS http://127.0.0.1:8000/v1/scenarios/cascade)}" | grep -q '"run_id"'
          [ "$(docker exec expsched id -u)" = 10001 ]
      - name: Журнал контейнера при падении
        if: failure()
        run: docker logs expsched
