name: ci
on: [push, pull_request]

jobs:
  py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: make lint types
      - run: make test
      - name: schemas are up to date
        run: make schema && git diff --exit-code schemas/
