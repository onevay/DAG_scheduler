name: ci
on: [push, pull_request]

jobs:
  py:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --all-extras
      - run: make lint types
      - run: make test
      - run: make perf
      - name: schemas are up to date
        run: make schema && git diff --exit-code schemas/
      - name: Уязвимости Python-зависимостей
        run: make audit-py

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: make web-install
      - name: Типы API совпадают со schemas/openapi.json
        run: npm --prefix ui/web run gen:types && git diff --exit-code ui/web/src/api/schema.ts
      - run: make web-lint
      - run: make web-test
      - run: make web-build
      - name: Уязвимости JS-зависимостей
        run: make audit-web

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --extra api  # API для сквозных проверок: fastapi и uvicorn
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: make web-install
      - name: Chromium для Playwright
        run: npm --prefix ui/web exec -- playwright install --with-deps chromium
      - run: make web-e2e
      - name: Отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/web/playwright-report
            ui/web/test-results
          retention-days: 7
