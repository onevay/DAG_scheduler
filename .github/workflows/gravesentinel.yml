name: ci-gravesentinel
on:
  push:
    paths: ["containers/gravesentinel/**", ".github/workflows/gravesentinel.yml"]
  pull_request:
    paths: ["containers/gravesentinel/**", ".github/workflows/gravesentinel.yml"]
  # Вручную: сборка, unit-тесты и rootful-наборы на стенде
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: containers/gravesentinel

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [default, asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: gravesentinel-${{ matrix.config }}
          repository-cache: true
      - if: matrix.config == 'default'
        run: bazel build --config=release //...
      - run: bazel test ${{ matrix.config != 'default' && format('--config={0}', matrix.config) || '' }} //:unit_tests --nocache_test_results

  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: unit
    runs-on: [self-hosted, linux, x64, gravesentinel-e2e]
    timeout-minutes: 90
    concurrency:
      group: gravesentinel-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: gravesentinel-e2e
          repository-cache: true
      - name: Квалифицированный стенд, uid 0
        run: |
          if [ "$(id -u)" -ne 0 ]; then
            echo "The E2E runner must run as uid 0; do not elevate Bazel with sudo." >&2
            exit 1
          fi
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          sh scripts/check_testbed.sh
      - name: Rootful-наборы
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          bazel test \
            //tests/integration:hypervisor_scheduler_e2e \
            //tests/integration:hypervisor_crash_recovery_e2e \
            //tests/integration:hypervisor_four_cpu_e2e \
            --test_output=streamed \
            --nocache_test_results

  # Агент expsched на настоящем гипервизоре: прогон criu_pairs, отказ узла, восстановление из снимка CRIU
  agent-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: e2e
    runs-on: [self-hosted, linux, x64, gravesentinel-e2e]
    timeout-minutes: 60
    concurrency:
      group: gravesentinel-e2e
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: gravesentinel-e2e
          repository-cache: true
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --extra api
      - name: Гипервизор и образ нагрузки
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
          GS="$RUNNER_TEMP/gravesentinel" && echo "GS=$GS" >> "$GITHUB_ENV"
          (cd containers/gravesentinel && bazel build --config=release //src/hypervisor:gravesentinel_hypervisor)
          podman build -f containers/workload/Containerfile -t localhost/expsched-workload:local .
          rm -rf "$GS" && mkdir -p "$GS/storage"
          containers/gravesentinel/bazel-bin/src/hypervisor/gravesentinel_hypervisor \
            --socket "$GS/hypervisor.sock" --storage "$GS/storage" \
            --podman /usr/bin/podman --criu /usr/sbin/criu --runtime-profile podman-criu-rootful-v1 \
            --scheduler-uid "$(id -u)" > "$GS/hypervisor.log" 2>&1 &
          echo $! > "$GS/hypervisor.pid"
          for i in $(seq 60); do grep -q 'startup ready' "$GS/hypervisor.log" && break; sleep 1; done
          grep -q 'startup ready' "$GS/hypervisor.log"
      - name: Сквозной прогон на агенте gravesentinel
        run: make agent-smoke-gs GS_SOCKET="$GS/hypervisor.sock"
      - name: Журнал гипервизора
        if: always()
        run: cat "$GS/hypervisor.log" || true
      - name: Остановить гипервизор и убрать контейнеры прогона
        if: always()
        run: |
          kill "$(cat "$GS/hypervisor.pid")" 2>/dev/null || true
          podman ps -a --filter label=io.gravesentinel.ccm.managed=true --format '{{.Names}}' \
            | grep '^expsched-' | xargs -r podman rm -f
