[project]
name = "expsched"
version = "0.1.0"
description = "Планировщик вычислительных экспериментов"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
ui = ["streamlit>=1.36", "plotly>=5.22", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "import-linter>=2.0", "pre-commit>=3.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expsched"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = [
    "expsched.domain",
    "expsched.contract",
    "expsched.analysis",
    "expsched.validation",
    "expsched.engine",
    "expsched.policies",
    "expsched.verify",
    "expsched.metrics",
    "expsched.explain",
    "expsched.pipeline",
    "expsched.api",
]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["ui/streamlit"]
markers = [
    "docker: требует Docker",
    "slow: долгие (ночной CI)",
]
